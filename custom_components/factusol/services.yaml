          mode: box
          unit_of_measurement: "€"
    hucha_ingreso:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    saldo_hucha_final:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    consumo_punta:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "kWh"
    consumo_llano:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "kWh"
    consumo_valle:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "kWh"
    excedente_kwh:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "kWh"
ajustar_hucha:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: factusol
    saldo:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    fecha:
      required: true
      selector:
        date:
ajustar_costes_fijos:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: factusol
